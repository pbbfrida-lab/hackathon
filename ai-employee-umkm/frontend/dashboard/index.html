<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="dashboard.pageTitle">OmniStaff AI — Kantor Virtual UMKM</title>
  <script>
    try { document.documentElement.lang = (localStorage.getItem('omnistaff_lang') || 'id') === 'en' ? 'en-US' : 'id-ID'; } catch (e) { /* storage diblokir */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="../assets/i18n.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OmniStaff AI</h1>
      <p data-i18n="dashboard.subtitle">Empat staf virtual yang bekerja untuk tokomu</p>
    </div>
    <nav>
      <a class="btn" href="/dashboard/overview.html" data-i18n="dashboard.overviewLink">Ringkasan</a>
      <div class="lang-switch" data-lang-switch></div>
    </nav>
  </header>

  <main class="layout">
    <section class="stage" data-i18n-attr="aria-label:dashboard.officeAria" aria-label="Kantor virtual 3D">
      <div id="office3d" role="img" data-i18n-attr="aria-label:dashboard.officeImgAria" aria-label="Kantor virtual 3D dengan empat staf AI"></div>
      <aside class="agent-panel" id="agentPanel" aria-labelledby="agentName" hidden>
        <header class="agent-panel-heading">
          <div>
            <p class="agent-panel-kicker" data-i18n="dashboard.agentLabel">STAF TERPILIH</p>
            <h2 id="agentName"></h2>
            <p class="agent-role" id="agentRole"></p>
          </div>
          <button class="agent-close" id="agentClose" type="button" data-i18n-attr="aria-label:dashboard.closeAgentPanel" aria-label="Tutup panel staf">×</button>
        </header>
        <p class="agent-task" id="agentTask"></p>
        <p class="agent-owner-hint" data-i18n="dashboard.ownerChannelHint">Percakapan ini menggunakan akses pemilik toko.</p>
        <div class="agent-conversation" id="agentConversation" role="log" aria-live="polite" data-i18n-attr="aria-label:dashboard.agentConversationAria" aria-label="Percakapan dengan staf"></div>
        <form class="agent-composer" id="agentMessageForm">
          <label class="sr-only" for="agentMessage" data-i18n="dashboard.messageAria">Pesan untuk staf</label>
          <div class="agent-input-wrap">
            <textarea id="agentMessage" rows="2" maxlength="1000" data-i18n-attr="placeholder:dashboard.messagePlaceholder" placeholder="Tulis pesan kepada staf…" required></textarea>
            <button class="btn agent-voice" id="agentVoice" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span class="sr-only" id="agentVoiceLabel" data-i18n="dashboard.voice">Voice</span>
            </button>
          </div>
          <button class="btn" id="agentSend" type="submit" data-i18n="dashboard.send">Kirim</button>
        </form>
        <p class="agent-panel-status" id="agentPanelStatus" role="status" aria-live="polite"></p>
      </aside>
      <p class="stage-hint" data-i18n="dashboard.stageHint">Seret untuk memutar kantor, gulir untuk zoom.</p>
    </section>

    <aside class="side">
      <section aria-labelledby="h-today">
        <h2 id="h-today" data-i18n="dashboard.today">Hari ini</h2>
        <div class="numbers">
          <div><strong id="n-orders">–</strong><span data-i18n="dashboard.orders">pesanan</span></div>
          <div><strong id="n-revenue">–</strong><span data-i18n="dashboard.revenue">omzet</span></div>
          <div><strong id="n-profit">–</strong><span data-i18n="dashboard.profit">laba</span></div>
        </div>
      </section>

      <section aria-labelledby="h-staff">
        <h2 id="h-staff" data-i18n="dashboard.staff">Staf</h2>
        <ul class="staff-list" id="staff-list" aria-live="polite"></ul>
      </section>

      <section aria-labelledby="h-chan">
        <h2 id="h-chan" data-i18n="dashboard.channels">Kanal pelanggan</h2>
        <ul class="staff-list" id="channel-list"></ul>
      </section>

      <section class="command" aria-labelledby="h-cmd">
        <h2 id="h-cmd" data-i18n="dashboard.command">Beri perintah</h2>
        <form id="cmd-form">
          <input id="cmd-input" type="text" autocomplete="off" data-i18n-attr="placeholder:dashboard.commandPlaceholder aria-label:dashboard.commandAria" placeholder="Contoh: stok kopi robusta" aria-label="Perintah untuk staf">
          <button class="btn" type="submit" id="cmd-send" data-i18n="dashboard.send">Kirim</button>
        </form>
        <div id="reply" role="status"></div>
      </section>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="../assets/api.js" defer></script>
  <script src="js/avatars.js" defer></script>
  <script src="js/office.js" defer></script>
  <script src="../ai-chat/voice.js" defer></script>
  <script src="js/office-interaction.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
