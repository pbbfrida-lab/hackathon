<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="chat.pageTitle">OmniStaff AI — Chat &amp; Suara</title>
  <script>
    try { document.documentElement.lang = (localStorage.getItem('omnistaff_lang') || 'id') === 'en' ? 'en-US' : 'id-ID'; } catch (e) { /* storage diblokir */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/css/style.css">
  <script src="/assets/i18n.js" defer></script>
  <style>
    body { display: flex; flex-direction: column; height: 100vh; }
    .chat-wrap { flex: 1; display: flex; flex-direction: column; max-width: 760px; width: 100%; margin: 0 auto; min-height: 0; }
    #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--indigo); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg small { display: block; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
    .msg img { display: block; max-width: 100%; margin-top: 8px; border-radius: 8px; }
    .composer { display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid var(--line); background: #fff; }
    .composer input { flex: 1; min-width: 0; font: inherit; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); }
    .mic { background: var(--jade); color: #fff; }
    .mic.on { background: #c0392b; }
    .tools { display: flex; align-items: center; gap: 8px; padding: 0 16px 8px; font-size: .85rem; color: var(--muted); }
    #status { min-height: 1.2em; }
  </style>
</head>
<body>
  <header class="topbar">
    <div><h1 data-i18n="chat.heading">Chat &amp; perintah suara</h1><p data-i18n="chat.subtitle">Tanya stok, buat pesanan, minta laporan atau poster</p></div>
    <nav>
      <a class="btn ghost" href="/dashboard/" data-i18n="chat.back">Kembali ke kantor</a>
      <div class="lang-switch" data-lang-switch></div>
    </nav>
  </header>

  <div class="chat-wrap">
    <div id="log" aria-live="polite"></div>
    <div class="tools">
      <label><input type="checkbox" id="speak"> <span data-i18n="chat.speak">Bacakan jawaban</span></label>
      <span id="status"></span>
    </div>
    <form class="composer" id="form">
      <button type="button" class="btn mic" id="mic" data-i18n="chat.talk" data-i18n-attr="aria-label:chat.talkAria" aria-label="Bicara dengan suara">Bicara</button>
      <input id="text" type="text" autocomplete="off" data-i18n-attr="placeholder:chat.typePlaceholder aria-label:chat.messageAria" placeholder="Ketik pesan…" aria-label="Pesan">
      <button class="btn" type="submit" id="send" data-i18n="chat.send">Kirim</button>
    </form>
  </div>

  <script src="/assets/api.js" defer></script>
  <script src="/ai-chat/voice.js" defer></script>
  <script src="/ai-chat/js/chat.js" defer></script>
</body>
</html>
